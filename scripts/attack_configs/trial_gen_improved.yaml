attack_name: "trial_gen_improved"
dataset: "assets/harmful_behaviors_custom_50.csv"
samples: 50
all_samples: false
restart: true
max_workers: 1
attempts_per_query: 3
attempts_success_threshold: 1

victim_model:
  model: "gpt-4o"
  provider: "openai"
  api_key: null
  api_base: null

eval_model:
  model: "llama-3-70b"
  provider: "openai"
  api_key: null
  api_base: null

attack_parameters:
  attack_model:
    model: "glm-4-plus"
    provider: "openai"
    api_key: null
    api_base: null
  # provider left null falls back to attack_model's provider
  helper_model:
    model: "gpt-4o"
    provider: null
    api_key: null
    api_base: null
  judge_model:
    model: "llama-3-70b-instruct"
    provider: "openai"
    api_key: null
    api_base: null
  target_model:
    model: "gpt-4o"
    provider: "openai"
    api_key: null
    api_base: null
  n_iterations: 5
  max_retries: 5
  attack_temperature: 1.0
  target_temperature: 1.0
  judge_temperature: 0.0
